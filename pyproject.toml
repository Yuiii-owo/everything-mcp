[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "everything-mcp"
version = "0.2.1"
description = "MCP server exposing the Everything SDK for fast local file search on Windows"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "everything-mcp contributors" }]
keywords = ["mcp", "everything", "windows", "search", "file-search"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = ["mcp>=2.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
everything-mcp = "everything_mcp.__main__:main"

[project.urls]
Homepage = "https://github.com/Yuiii-owo/everything-mcp"
Repository = "https://github.com/Yuiii-owo/everything-mcp"
Issues = "https://github.com/Yuiii-owo/everything-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["everything_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"dll" = "everything_mcp/dll"

[tool.hatch.build.targets.sdist]
include = [
    "everything_mcp",
    "tests",
    "dll",
    "install.ps1",
    "install.bat",
    "README.md",
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "pyproject.toml",
]
